<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Work & Salary Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 700px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
        }
        label {
            font-weight: bold;
        }
        input {
            padding: 8px;
            margin: 5px 0 15px;
            width: 100%;
            box-sizing: border-box;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
        th {
            background: #eee;
        }
        .salary-box {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            background: #e1ffe1;
            border: 1px solid #7ad67a;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Employee Weekly Salary Calculator</h2>

        <label>Name:</label>
        <input type="text" id="empName" placeholder="Enter employee name" value="Juan Dela Cruz">

        <label>Age:</label>
        <input type="number" id="empAge" placeholder="Enter age" value="25">

        <label>Position:</label>
        <input type="text" id="empPosition" placeholder="Enter job position" value="Cashier">

        <label>Salary Per Day (₱):</label>
        <input type="number" id="dailySalary" value="500" />

        <table>
            <thead>
                <tr>
                    <th>Day</th>
                    <th>Worked?</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>Monday</td><td><input type="checkbox" class="day-check"></td></tr>
                <tr><td>Tuesday</td><td><input type="checkbox" class="day-check"></td></tr>
                <tr><td>Wednesday</td><td><input type="checkbox" class="day-check"></td></tr>
                <tr><td>Thursday</td><td><input type="checkbox" class="day-check"></td></tr>
                <tr><td>Friday</td><td><input type="checkbox" class="day-check"></td></tr>
                <tr><td>Saturday</td><td><input type="checkbox" class="day-check"></td></tr>
                <tr><td>Sunday</td><td><input type="checkbox" class="day-check"></td></tr>
            </tbody>
        </table>

        <div class="salary-box" id="totalSalaryBox">Total Salary: ₱0</div>
    </div>

    <script>
        const checkboxes = document.querySelectorAll('.day-check');
        const dailySalaryInput = document.getElementById('dailySalary');
        const totalSalaryBox = document.getElementById('totalSalaryBox');

        function calculateSalary() {
            let workedDays = 0;
            checkboxes.forEach(cb => { if (cb.checked) workedDays++; });

            const dailySalary = Number(dailySalaryInput.value) || 0;
            const total = workedDays * dailySalary;
            totalSalaryBox.textContent = `Total Salary: ₱${total}`;
        }

        checkboxes.forEach(cb => cb.addEventListener('change', calculateSalary));
        dailySalaryInput.addEventListener('input', calculateSalary);
    // Save to localStorage
function saveData() {
    const data = {
        name: document.getElementById('empName').value,
        age: document.getElementById('empAge').value,
        position: document.getElementById('empPosition').value,
        dailySalary: dailySalaryInput.value,
        worked: Array.from(checkboxes).map(cb => cb.checked)
    };
    localStorage.setItem('employeeData', JSON.stringify(data));
}

// Load saved data
function loadData() {
    const saved = localStorage.getItem('employeeData');
    if (!saved) return;
    const data = JSON.parse(saved);

    document.getElementById('empName').value = data.name;
    document.getElementById('empAge').value = data.age;
    document.getElementById('empPosition').value = data.position;
    dailySalaryInput.value = data.dailySalary;

    data.worked.forEach((val, i) => {
        checkboxes[i].checked = val;
    });

    calculateSalary();
}

// Add event listeners
checkboxes.forEach(cb => cb.addEventListener('change', () => { calculateSalary(); saveData(); }));
dailySalaryInput.addEventListener('input', () => { calculateSalary(); saveData(); });
document.getElementById('empName').addEventListener('input', saveData);
document.getElementById('empAge').addEventListener('input', saveData);
document.getElementById('empPosition').addEventListener('input', saveData);

// Load on start
loadData();

</script>
</body>
</html>
