<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Employee Salary Tracker</title>
<style>
    body { font-family: Arial, sans-serif; background:#f4f4f4; padding:20px; }
    .container { max-width:1000px; margin:auto; background:white; padding:20px; border-radius:10px; }
    h2 { text-align:center; }
    .employee-box { border:1px solid #ccc; padding:15px; margin-bottom:20px; border-radius:10px; background:#fafafa; }
    label { font-weight:bold; }
    input { width:100%; padding:8px; margin:5px 0 10px; }
    table { width:100%; border-collapse:collapse; margin-top:10px; }
    th, td { border:1px solid #ccc; padding:8px; text-align:center; }
    th { background:#eee; }
    .total-box { background:#e1ffe1; padding:10px; margin-top:10px; text-align:center; font-weight:bold; }
</style>
</head>
<body>
<div class="container">
<h2>King Dragon Houseware Employees Salary Tracker</h2>

<div id="employees"></div>
</div>

<script>
const days = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const employeeCount = 4;

function createEmployee(id) {
    return `
    <div class='employee-box' id='emp_${id}'>
        <h3>Employee ${id}</h3>

        <label>Name:</label>
        <input type='text' id='name_${id}' placeholder='Enter name'>

        <label>Age:</label>
        <input type='number' id='age_${id}' placeholder='Enter age'>

        <label>Position:</label>
        <input type='text' id='position_${id}' placeholder='Enter position'>

        <label>Daily Salary (₱):</label>
        <input type='number' id='salary_${id}' value='500'>

        <table>
            <thead><tr><th>Day</th><th>Worked?</th></tr></thead>
            <tbody>
                ${days.map((d,i)=>`<tr><td>${d}</td><td><input type='checkbox' class='day_${id}' data-index='${i}'></td></tr>`).join('')}
            </tbody>
        </table>

        <div class='total-box' id='total_${id}'>Total Salary: ₱0</div>
    </div>`;
}

document.getElementById("employees").innerHTML =
    Array.from({length: employeeCount}, (_, i) => createEmployee(i + 1)).join('');

function calculateSalary(id) {
    const dailySalary = Number(document.getElementById(`salary_${id}`).value) || 0;
    const checks = document.querySelectorAll(`.day_${id}`);

    let workedDays = 0;
    checks.forEach(cb => { if (cb.checked) workedDays++; });

    const total = workedDays * dailySalary;
    document.getElementById(`total_${id}`).textContent = `Total Salary: ₱${total}`;
    saveData();
}

function saveData() {
    const all = {};

    for (let i = 1; i <= employeeCount; i++) {
        const checks = document.querySelectorAll(`.day_${i}`);
        all[`emp_${i}`] = {
            name: document.getElementById(`name_${i}`).value,
            age: document.getElementById(`age_${i}`).value,
            position: document.getElementById(`position_${i}`).value,
            salary: document.getElementById(`salary_${i}`).value,
            worked: Array.from(checks).map(cb => cb.checked)
        };
    }

    localStorage.setItem("multiEmployeeData", JSON.stringify(all));
}

function loadData() {
    const saved = localStorage.getItem("multiEmployeeData");
    if (!saved) return;

    const all = JSON.parse(saved);

    for (let i = 1; i <= employeeCount; i++) {
        const data = all[`emp_${i}`];
        if (!data) continue;

        document.getElementById(`name_${i}`).value = data.name;
        document.getElementById(`age_${i}`).value = data.age;
        document.getElementById(`position_${i}`).value = data.position;
        document.getElementById(`salary_${i}`).value = data.salary;

        const checks = document.querySelectorAll(`.day_${i}`);
        data.worked.forEach((v, idx) => { checks[idx].checked = v; });
        calculateSalary(i);
    }
}

setTimeout(() => {
    for (let i = 1; i <= employeeCount; i++) {
        document.getElementById(`salary_${i}`).addEventListener('input', () => calculateSalary(i));
        document.getElementById(`name_${i}`).addEventListener('input', saveData);
        document.getElementById(`age_${i}`).addEventListener('input', saveData);
        document.getElementById(`position_${i}`).addEventListener('input', saveData);

        document.querySelectorAll(`.day_${i}`).forEach(cb => {
            cb.addEventListener('change', () => calculateSalary(i));
        });
    }

    loadData();
}, 200);
</script>

</body>
</html>
